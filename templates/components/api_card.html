<article class="api-card">
  <div class="card-head">
    <h3 class="card-title"><a href="{{BASE}}/api/{{SLUG}}/">{{NAME}}</a></h3>
    {{AUTH_BADGE}}
  </div>
  <p class="card-desc">{{DESCRIPTION}}</p>
  <div class="card-meta">
    <a class="chip" href="{{BASE}}/category/{{CATEGORY_SLUG}}/">{{CATEGORY_NAME}}</a>
    {{HTTPS_BADGE}}
    {{CORS_BADGE}}
    {{STATUS_BADGE}}
  </div>
</article>
